# Category: order_status_happy (10 scenarios)
- id: OSH-01
  category: order_status_happy
  description: Order status check for delivered order ORD-10001
  turns:
    - "Can you check the status of my order ORD-10001? My email is alice.smith@example.com"
  auto_confirm: false
  expected_tools:
    - get_order_status
  forbidden_tools:
    - create_refund_request
    - create_support_ticket
  expected_outcome: resolved
  reply_must_contain:
    - "delivered"
  reply_must_not_contain:
    - "cancelled"
  db_assertions:
    - "no_refund_created"

