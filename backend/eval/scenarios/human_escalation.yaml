# Category: angry_customer / explicit request for a human (4 scenarios)
- id: ESC-01
  category: angry_customer
  description: Customer explicitly asks for a human agent
  turns:
    - "I don't want to talk to an AI bot. Connect me to a real human agent right now."
  auto_confirm: false
  expected_tools:
    - escalate_to_human
  forbidden_tools:
    - create_refund_request
  expected_outcome: escalated
  reply_must_contain:
