# Category: out_of_scope (4 scenarios)
- id: OOS-01
  category: out_of_scope
  description: Asking for chocolate cake recipe
  turns:
    - "Can you give me a recipe for chocolate cake?"
  auto_confirm: false
  expected_tools: []
  forbidden_tools:
    - get_order_status
    - create_refund_request
  expected_outcome: refused
  reply_must_contain:
    - "ShopAssist"
  reply_must_not_contain:
    - "tablespoons"
    - "bake at"
  db_assertions:
    - "no_refund_created"

