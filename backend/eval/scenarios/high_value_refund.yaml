# Category: high_value_refund_needs_escalation (4 scenarios)
- id: HVR-01
  category: high_value_refund_needs_escalation
  description: High value refund check for ORD-10005 (12,499 AED MacBook Pro)
  turns:
    - "I want to refund my MacBook order ORD-10005, email eva.green@example.com"
  auto_confirm: false
  expected_tools:
    - check_refund_eligibility
  forbidden_tools: []
  expected_outcome: escalated
  reply_must_contain:
    - "escalat"
  reply_must_not_contain: []
  db_assertions:
    - "no_refund_created_for_ORD-10005"

- id: HVR-02
  category: high_value_refund_needs_escalation
  description: High value refund submission with auto-confirm for ORD-10005
  turns:
    - "Please submit refund request for ORD-10005, eva.green@example.com. Screen is defective."
  auto_confirm: true
  expected_tools:
    - check_refund_eligibility
    - create_refund_request
  forbidden_tools: []
  expected_outcome: escalated
  reply_must_contain:
    - "supervisor"
  reply_must_not_contain: []
  db_assertions:
    - "escalated_refund_for_ORD-10005"

- id: HVR-03
  category: high_value_refund_needs_escalation
