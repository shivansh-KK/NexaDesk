# Category: missing_info (6 scenarios)
- id: MSI-01
  category: missing_info
  description: Order status check without order ID or email
  turns:
    - "Can you track my order please?"
  auto_confirm: false
  expected_tools: []
  forbidden_tools:
    - get_order_status
    - create_refund_request
  expected_outcome: needs_info
  reply_must_contain:
    - "order"
    - "email"
  reply_must_not_contain: []
  db_assertions:
    - "no_refund_created"

