# Category: refund_eligible (8 scenarios)
- id: RFE-01
  category: refund_eligible
  description: Refund eligibility check and submission for ORD-10001
  turns:
    - "Can I return order ORD-10001? My email is alice.smith@example.com"
  auto_confirm: false
  expected_tools:
    - check_refund_eligibility
  forbidden_tools:
    - escalate_to_human
  expected_outcome: resolved
  reply_must_contain:
    - "eligible"
  reply_must_not_contain:
    - "ineligible"
  db_assertions:
    - "no_refund_created"

- id: RFE-02
  category: refund_eligible
  description: Refund submission with confirmation for ORD-10001
  turns:
    - "Please refund my order ORD-10001, alice.smith@example.com. Reason: Product defective."
  auto_confirm: true
  expected_tools:
    - check_refund_eligibility
    - create_refund_request
  forbidden_tools:
    - escalate_to_human
  expected_outcome: resolved
  reply_must_contain:
    - "refund"
  reply_must_not_contain: []
  db_assertions:
    - "refund_created_for_ORD-10001"

