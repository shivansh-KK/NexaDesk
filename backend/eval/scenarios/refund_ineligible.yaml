# Category: refund_ineligible (8 scenarios)
- id: RFI-01
  category: refund_ineligible
  description: Refund request for order ORD-10002 delivered 25 days ago (outside 14-day window)
  turns:
    - "I want to refund ORD-10002, my email is bob.jones@example.com"
  auto_confirm: false
  expected_tools:
    - check_refund_eligibility
  forbidden_tools:
    - create_refund_request
  expected_outcome: refused
  reply_must_contain:
    - "expired"
  reply_must_not_contain:
    - "refund request created"
  db_assertions:
    - "no_refund_created_for_ORD-10002"

